<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calc-wrapper">
      <a href="https://ompatel4723.github.io/Portfolio/" class="back-link"
        >&larr; Back to Portfolio</a
      >

      <div class="calculator-container">
        <!-- Header -->
        <div class="calc-header">
          <span class="calc-title">Scientific Calculator</span>
          <div class="header-actions">
            <button type="button" id="angleModeBtn" class="toggle-btn">
              DEG
            </button>
            <button type="button" id="scientificToggleBtn" class="toggle-btn">
              Scientific
            </button>
            <button type="button" id="historyToggleBtn" class="toggle-btn">
              History
            </button>
          </div>
        </div>

        <div class="main-layout">
          <!-- Calculator Main-->
          <div id="calculatorPanel" class="calc-panel">
            <div class="display-area">
              <div
                id="previousDisplay"
                class="previous-display"
                aria-live="polite"
              >
                &nbsp;
              </div>
              <input
                type="text"
                id="currentDisplay"
                class="current-display"
                value="0"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                aria-label="Calculator Display"
              />
            </div>

            <div id="buttonsGrid" class="buttons-grid">
              <!-- Scientific Part -->
              <div id="scientificBlock" class="scientific-grid hidden">
                <button class="btn btn-func" data-action="sin">sin</button>
                <button class="btn btn-func" data-action="cos">cos</button>
                <button class="btn btn-func" data-action="tan">tan</button>
                <button class="btn btn-func" data-action="log">log</button>
                <button class="btn btn-func" data-action="ln">ln</button>

                <button class="btn btn-func" data-action="sqrt">&radic;</button>
                <button class="btn btn-func" data-action="pow">x&sup2;</button>
                <button class="btn btn-func" data-action="power">
                  x<sup>y</sup>
                </button>
                <button class="btn btn-func" data-action="pi">&pi;</button>
                <button class="btn btn-func" data-action="e">e</button>

                <button class="btn btn-func" data-value="(">(</button>
                <button class="btn btn-func" data-value=")">)</button>
                <button class="btn btn-func" data-action="fact">n!</button>
                <button class="btn btn-func" data-action="abs">|x|</button>
                <button class="btn btn-func" data-action="inv">
                  <sup>1</sup>&frasl;<sub>x</sub>
                </button>
              </div>

              <!-- Row 1 -->
              <button class="btn btn-clear" data-action="clear">AC</button>
              <button class="btn btn-action" data-action="backspace">
                &#9003;
              </button>
              <button class="btn btn-op" data-value="%">%</button>
              <button class="btn btn-op" data-value="&divide;">&divide;</button>

              <!-- Row 2 -->
              <button class="btn" data-value="7">7</button>
              <button class="btn" data-value="8">8</button>
              <button class="btn" data-value="9">9</button>
              <button class="btn btn-op" data-value="&times;">&times;</button>

              <!-- Row 3 -->
              <button class="btn" data-value="4">4</button>
              <button class="btn" data-value="5">5</button>
              <button class="btn" data-value="6">6</button>
              <button class="btn btn-op" data-value="-">-</button>

              <!-- Row 4 -->
              <button class="btn" data-value="1">1</button>
              <button class="btn" data-value="2">2</button>
              <button class="btn" data-value="3">3</button>
              <button class="btn btn-op" data-value="+">+</button>

              <!-- Row 5 -->
              <button class="btn" data-action="negate">+/-</button>
              <button class="btn" data-value="0">0</button>
              <button class="btn" data-value=".">.</button>
              <button class="btn btn-equals" data-action="calculate">=</button>
            </div>
          </div>

          <!-- History -->
          <div id="historyPanel" class="history-panel hidden">
            <div class="history-header">
              <span>Calculation History</span>
              <button id="clearHistoryBtn" class="clear-btn">Clear</button>
            </div>
            <div id="historyList" class="history-list">
              <div class="empty-history">No calculation history yet</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
